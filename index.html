<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRA Smart Intelligence App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e40af">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white shadow-md py-4 px-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-white text-blue-900 px-3 py-1.5 rounded-lg font-black shadow-inner">SBI</div>
        <div>
          <h1 class="text-lg font-bold tracking-wide">CRA Credit Intelligence PWA</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Left Column: Inputs -->
    <div class="lg:col-span-4 flex flex-col gap-6">
      
      <!-- Settings Panel -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <h2 class="text-sm font-bold text-slate-700 mb-4 border-b pb-2">Global Settings</h2>
        <label class="block text-xs font-semibold text-slate-500 mb-1">EBLR Rate (%)</label>
        <input type="number" id="eblr-input" value="7.90" step="0.05" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-2 font-bold text-blue-900 focus:ring-2 focus:ring-blue-600 outline-none" oninput="runCVALookup()">
      </div>

      <!-- Rating Lookup -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <label class="block text-sm font-semibold text-slate-600 mb-2">Select SB Rating</label>
        <select id="sb-rating" class="w-full bg-slate-100 border border-slate-300 rounded-xl px-4 py-3 text-lg font-bold text-slate-800 focus:ring-2 focus:ring-blue-600 outline-none" onchange="runCVALookup()"></select>
      </div>

      <!-- Profile -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
        <div class="space-y-4">
          <div><span class="text-[10px] font-bold text-slate-400 block uppercase">Risk Level</span><span id="res-risk" class="font-bold">-</span></div>
          <div><span class="text-[10px] font-bold text-slate-400 block uppercase">Mapped BRE Grade</span><span id="res-bre" class="font-bold text-blue-800">-</span></div>
        </div>
      </div>
    </div>

    <!-- Right Column: Results -->
    <div class="lg:col-span-8 bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="mb-6 flex gap-4 border-b pb-4">
        <button onclick="switchTab('pricing')" id="tab-pricing" class="font-bold text-blue-900 border-b-2 border-blue-900 pb-1">ROI & Pricing</button>
        <button onclick="switchTab('limits')" id="tab-limits" class="font-bold text-slate-400 hover:text-slate-800">Exposure Limits</button>
      </div>

      <!-- ROI Tab -->
      <div id="content-pricing" class="tab-content grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="p-5 bg-blue-50 rounded-2xl border border-blue-100">
          <span class="text-xs font-bold text-blue-800 uppercase block">Proposed Lending Rate</span>
          <span id="rate-proposed" class="text-4xl font-extrabold text-blue-900">-</span>
        </div>
        <div class="p-5 bg-slate-50 rounded-2xl border border-slate-100">
          <span class="text-xs font-bold text-slate-500 uppercase block">Credit Risk Premium</span>
          <span id="rate-premium" class="text-4xl font-extrabold text-slate-800">-</span>
        </div>
      </div>

      <!-- Limits Tab -->
      <div id="content-limits" class="tab-content hidden space-y-4">
        <h4 class="font-bold text-sm text-slate-700">Aggregate Exposure Limits (Crore)</h4>
        <div id="limit-container" class="grid grid-cols-3 gap-4">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <script>
    const ratingDetails = Array.from({length: 15}, (_, i) => ({
      id: `SB-${i+1}`, 
      risk: i < 5 ? "Low" : (i < 10 ? "Moderate" : "High"),
      premium: [1.75, 1.75, 2.50, 2.50, 2.50, 4.00, 4.00, 4.75, 5.10, 5.60, 8.10, 8.10, 8.10, 8.10, 8.10][i],
      limitCorp: i < 5 ? 35 : 30
    }));

    window.onload = () => {
      const select = document.getElementById("sb-rating");
      ratingDetails.forEach(r => {
        let opt = document.createElement("option");
        opt.value = r.id;
        opt.textContent = r.id;
        select.appendChild(opt);
      });
      runCVALookup();
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
      document.getElementById(`content-${tab}`).classList.remove("hidden");
    }

    function runCVALookup() {
      const eblr = parseFloat(document.getElementById("eblr-input").value) || 0;
      const selectedId = document.getElementById("sb-rating").value;
      const data = ratingDetails.find(r => r.id === selectedId);

      // Calc Pricing
      const proposed = (eblr + 2.65 + data.premium).toFixed(2);
      document.getElementById("rate-proposed").textContent = proposed + "%";
      document.getElementById("rate-premium").textContent = data.premium + "%";
      document.getElementById("res-risk").textContent = data.risk;
      document.getElementById("res-bre").textContent = `BRE-${data.id.split('-')[1]}`;

      // Update Limits
      document.getElementById("limit-container").innerHTML = `
        <div class="p-3 bg-slate-50 rounded">Corp: <strong>${data.limitCorp} Cr</strong></div>
        <div class="p-3 bg-slate-50 rounded">Non-Corp: <strong>${data.limitCorp - 20} Cr</strong></div>
        <div class="p-3 bg-slate-50 rounded">Ind: <strong>${data.limitCorp - 25} Cr</strong></div>
      `;
    }
  </script>
</body>
</html>
